@media (pointer:coarse){.pad{display:flex}p{display:none}}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#rot{display:none;order:2;font-size:9px;line-height:1.8;text-align:center;color:#b9b3e0;padding:0 16px}
#cfg .box{max-height:100%;overflow:auto}
@media (pointer:coarse){

}
</style>
</head>
